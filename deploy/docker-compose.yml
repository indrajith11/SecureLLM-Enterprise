# Full stack: the governance-enforced app + the real local model.
#   docker compose -f deploy/docker-compose.yml up --build
# The app auto-detects Ollama (MODEL_PROVIDER=auto) and only reaches it
# through the internal service network - Ollama is never exposed publicly.
#
# Hardening kept from v1: read-only rootfs, ALL capabilities dropped,
# no-new-privileges, model weights and data volumes separated.
#
# DEPLOY-01 remediation: the JWT signing secret is REQUIRED from the
# environment (${JWT_SECRET:?...} makes compose fail fast with a clear
# message instead of the app crashing at first login against a read-only
# rootfs). The fallback secret file, if any, is written to the writable
# app_config volume via SECRETS_DIR. Generate a secret for local use:
#   python -c "import secrets; print(secrets.token_urlsafe(48))"
# or put JWT_SECRET=... in deploy/.env (git-ignored).
#
# Pre-deployment gate additions:
#   * AI_ENABLED kill switch: set AI_ENABLED=false in deploy/.env to turn
#     every chat entry point into an immediate 503 (login, /health, /metrics
#     and the admin surfaces stay up). Flip it back and `compose up -d` to
#     restore service. This is the incident-response "unplug the model"
#     lever - see docs/governance/incident_response.md.
#   * TLS reverse proxy (pre-deploy gate Step 2): start the OPTIONAL caddy
#     service with
#       docker compose -f deploy/docker-compose.yml --profile tls up -d
#     Caddy terminates TLS on 443 and proxies to the app; with the default
#     Caddyfile it issues an internal certificate for localhost (dev), and
#     for a real domain you swap one line for the ACME/Let's Encrypt
#     directive (see deploy/caddy/Caddyfile). When TLS is active, set
#     cookie_secure: true in config/app_config.yaml so the session cookie
#     is marked Secure.

services:

  # ---- the real local LLM (qwen2.5:0.5b) ---------------------------------
  ollama:
    image: ollama/ollama:0.12.10
    # Wave 3.2 (serving efficiency on small hardware): allow parallel
    # requests into the runtime, keep the model resident, cap loaded models.
    environment:
      OLLAMA_NUM_PARALLEL: "4"      # concurrent decode slots inside Ollama
      OLLAMA_MAX_LOADED_MODELS: "2" # fast + reasoner can both stay resident
      OLLAMA_KEEP_ALIVE: "30m"      # no cold reload between bursts
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Optional GPU passthrough (NVIDIA): uncomment + install nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  # ---- one-shot model pull (runs once, then exits) ------------------------
  ollama-init:
    image: ollama/ollama:0.12.10
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-qwen2.5:0.5b}"]
    restart: "no"

  # ---- one-shot data bootstrap (RAG-03: a named volume mounts OVER /app/db,
  # hiding repo-committed indexes on first run - this container seeds the
  # volume: schema + demo data + users + vector index) ----------------------
  ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["python", "-m", "scripts.seed_company_data"]
    volumes:
      - app_data:/app/db
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  # ---- the governed application ------------------------------------------
  securellm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HOST: 0.0.0.0                # serve inside the container
      MODEL_PROVIDER: auto         # -> ollama when healthy, mock otherwise
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      # colibri backend (v4.3.0, optional): set MODEL_PROVIDER=colibri and
      # point COLIBRI_URL at a host running "coli serve". Hardware floors
      # per model family: docs/colibri.md. Never auto-selected.
      COLIBRI_URL: ${COLIBRI_URL:-http://localhost:8000}
      COLIBRI_API_KEY: ${COLIBRI_API_KEY:-}
      COLIBRI_MODEL: ${COLIBRI_MODEL:-glm-5.2-colibri}
      # DEPLOY-01: required - compose refuses to boot the app without it
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env or your shell}
      SECRETS_DIR: /tmp/secrets    # writable fallback path (read_only rootfs safe)
      # DASH-04: set a scrape token to lock /metrics down (optional but
      # recommended whenever the port is published)
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Pre-deploy gate Step 7: operator kill switch. "false" (or any
      # unrecognized value - fail-closed) returns 503 on every chat route.
      AI_ENABLED: ${AI_ENABLED:-true}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      ingest:
        condition: service_completed_successfully
    read_only: true                # immutable root filesystem
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - app_data:/app/db           # SQLite (audit chain) + vector indexes
      - app_logs:/app/logs         # JSONL audit mirror
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ---- optional TLS-terminating reverse proxy (pre-deploy gate Step 2) -----
  # NOT started by default: docker compose ... --profile tls up -d
  # - terminates HTTPS on 443 (internal cert for localhost; swap the Caddyfile
  #   site line for your domain to get automatic Let's Encrypt certificates)
  # - adds HSTS + standard reverse-proxy headers
  # - the app port stays published on 127.0.0.1:8000 for local health checks
  caddy:
    image: caddy:2.10.0
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - securellm
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  ollama_models:
  app_data:
  app_logs:
  caddy_data:
  caddy_config:
