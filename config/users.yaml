# Identity bootstrap note (Layer 1).
#
# This file previously carried a SHA-256 fallback identity store with
# credentials written in comments next to the hashes.
# REMOVED per security audit finding AUTH-02: SHA-256 is not a password
# hash, and secrets in comments are secrets in the repository.
#
# The ONLY identity store is the `users` table in db/company.db, seeded by:
#     python scripts/seed_users.py
# Passwords there are bcrypt hashes (cost 12). Authentication fails closed
# when this table is absent - there is no file-based fallback account.
#
# PRODUCTION: replace local seeding with OIDC/SSO + MFA and provision
# credentials from a secrets manager. Never commit credentials or their
# hashes to version control.
users: []   # intentionally empty - see above
