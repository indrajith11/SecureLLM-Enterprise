# Application-level settings. Environment variables override these values.
# Every key here is READ BY CODE (audit DEPLOY-05: dead config removed).
secure_mode: true

model:
  provider: auto          # auto | mock | ollama
  ollama_url: http://localhost:11434
  ollama_model: qwen2.5:0.5b
  request_timeout_s: 30
  max_output_tokens: 512
  # Wave 3.1: two-model router. heuristic routes "why/compare/explain"
  # questions to reasoner_model, everything else to fast_model; on a
  # ProviderUnavailable the router falls back to the OTHER model before
  # degrading to the mock. Both default to ollama_model so a single-model
  # install behaves exactly as before - point reasoner_model at a bigger
  # model (e.g. qwen3:8b) to activate the chain.
  routing: heuristic               # heuristic | single
  fast_model: qwen2.5:0.5b
  reasoner_model: qwen2.5:0.5b
  # Wave 1.3: per-intent output budgets (replace the single 512 cap for
  # routed requests). Small lookups stop early; analysis gets room.
  fast_intent_max_tokens: 220
  reason_intent_max_tokens: 600

session:
  jwt_algorithm: HS256    # pinned; never accept "alg" from the token itself
  token_exp_minutes: 60   # per-user sessions expire after 60 minutes
  # jwt_secret: only used when the JWT_SECRET env var is absent (dev convenience).
  # Leave unset in production and inject JWT_SECRET from a secrets manager.
  # jwt_secret: ""

availability:             # CIA-A per-user consumption guard
  max_concurrent_sessions: 3
  session_ttl_minutes: 60
  max_prompt_chars: 4000          # payload size cap (OWASP LLM10)
  max_concurrent_chat: 8          # global worker gate (whole-system CIA-A)
  queue_wait_s: 10                # Wave 3.2: bounded queue before 503
  max_concurrent_per_user: 2      # Wave 3.2: one user cannot hog every slot

rate_limit:               # Layer 2 (OWASP LLM10: Unbounded Consumption)
  requests_per_minute: 20
  token_budget_per_minute: 6000
  est_chars_per_token: 4

input_filter:             # Layer 2 (OWASP LLM01: Prompt Injection)
  block_score: 6.0

output_filter:            # Layer 6 (OWASP LLM02: Sensitive Information Disclosure)
  # CHAT-03/DEPLOY-05: SOFT violations (money/email/phone/faithfulness
  # figures) are redacted with visible markers instead of blocking the
  # whole answer. HARD violations (canary, system marks, injection residue,
  # credential shapes, Luhn-valid cards) always block regardless.
  redact_instead_of_block: true

retrieval:                # Layer 4
  top_k: 5
  min_score: 0.12
  max_rows: 10                    # RAG-02: generic row dumps are capped
  max_context_chars: 6000         # RAG-02: hard context budget
  # Wave 4.1: embedder swap point. hash (default) = zero-download 256-dim
  # feature hashing; st = sentence-transformers (opt-in, lazy singleton).
  # Switching is a config change + restart: vectors are never persisted,
  # matrices rebuild from texts on first search. If the optional package
  # is missing the store falls back to hash; live encode failures fall
  # back per-call and are counted (ai_embedder_fallbacks_total).
  embedder: hash                  # hash | st
  st_model: all-MiniLM-L6-v2      # Wave 4.2 multilingual: bge-m3 (Hindi/Hinglish)
  # st_model: BAAI/bge-m3

action_gate:              # Layer 3.5 (OWASP LLM03: Excessive Agency / HITL)
  enabled: true
  approver_roles: [Executive, Admin]   # segregation of duties: requester != approver
  expiry_minutes: 60              # CODE-01: pending requests expire
  risky_patterns:               # config, not code: auditable "what is high risk"
    - "delete_employee :: (delete|remove|fire|terminate)\\s+(\\w+\\s+){0,3}(employee|record|row|user|staff|account|person)"
    - "mutate_record :: (update|change|modify|edit)\\s+(\\w+\\s+){0,3}(salary|record|employee|role|department|bonus|status)"
    - "drop_table :: (drop|truncate)\\s+table"
    - "transfer :: (transfer|move|wire)\\s+(\\w+\\s+){0,3}(employee|amount|money|funds|department|salary)"
    - "promote_demote :: (promote|demote)\\s+\\w"
    - "credential_reset :: (reset|change)\\s+(\\w+\\s+){0,3}(password|credentials?)"
    - "send_communication :: (send|draft|email)\\s+(\\w+\\s+){0,3}(email|message|mail)"
    - "approve_payment :: (approve|issue|pay)\\s+(\\w+\\s+){0,3}(payment|invoice|bonus|raise)"
    - "execute_code :: (execute|run)\\s+(\\w+\\s+){0,3}(command|script|sql|code|query)"
    - "bulk_export :: (export|download)\\s+(\\w+\\s+){0,3}(csv|report|data|records?|employees?)"
    - "mass_deletion :: (delete|drop|erase|wipe)\\s+(all|everything|entire)"
    - "mass_deletion :: (wipe|purge|nuke|erase)\\s+(\\w+\\s+){0,3}(table|database|records?|employees?|payroll)"
    - "privilege_escalation :: (grant|give|make)\\s+(me|us|\\w+)\\s+.{0,20}(admin|executive|root|approver|elevated|manager)"
    - "privilege_escalation :: (elevate|escalate)\\s+(my|the)?\\s*.{0,15}(privileges?|permissions?|clearance|role|access)"
    - "privilege_escalation :: (approve|confirm)\\s+(my|the)\\s+own"
    - "bulk_export :: (dump|export|download)\\s+(the\\s+)?(entire\\s+)?(database|db|table|payroll|employee\\s+data)"

audit:                    # Layer 7
  jsonl_mirror: true
  retention_days: 180             # RAG-07: purge job re-anchors the chain
