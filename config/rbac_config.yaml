# Layer 3: RBAC Policy Engine configuration.
# Every rule below is enforced server-side. The model never decides access.
#
# Clearance (L1..L5) comes from the users table and rides in the JWT
# (claim `clr`); the CIA-C enforcer uses it for sensitivity tiers. RBAC
# itself decides tables/columns/namespaces - least privilege per ROLE.

roles:

  Admin:
    departments: [HR, Tech, Business, Finance, Executive, IT, Legal, Marketing, Operations]
    allowed_tables:
      - employees
      - employees_tech_view
      - employees_public_view
      - executives
      - companies
      - locations
      - teams
      - org_hierarchy
    allowed_columns:
      employees: [id, name, department, role, email, phone, salary]
      employees_tech_view: [id, name, department, role]
      employees_public_view: [id, name, department, role, join_date]
      executives: [id, name, role, bonus]
      companies: [id, name, legal_name, industry, hq_city, country, founded_year]
      locations: [id, name, city, country, office_type, address]
      teams: [id, name, department, lead_name, location_city]
      org_hierarchy: [emp_id, emp_name, department, reports_to_id, reports_to_name]
    allowed_namespaces: [hr_docs, tech_docs, business_docs, finance_docs, exec_docs, it_docs, legal_docs, ops_docs]
    sensitive_patterns: [canary]

  Executive:
    departments: [HR, Tech, Business, Finance, Executive, IT, Legal, Marketing, Operations]
    allowed_tables:
      - employees
      - employees_public_view
      - executives
      - companies
      - locations
      - org_hierarchy
    allowed_columns:
      employees: [id, name, department, role, email, phone, salary]
      employees_public_view: [id, name, department, role, join_date]
      executives: [id, name, role, bonus]
      companies: [id, name, legal_name, industry, hq_city, country, founded_year]
      locations: [id, name, city, country, office_type, address]
      org_hierarchy: [emp_id, emp_name, department, reports_to_id, reports_to_name]
    allowed_namespaces: [hr_docs, tech_docs, business_docs, finance_docs, exec_docs, it_docs, legal_docs, ops_docs]
    sensitive_patterns: [canary]

  HR_Manager:
    departments: [HR]
    allowed_tables:
      - employees
      - employees_public_view
    allowed_columns:
      employees: [id, name, department, role, email, phone, salary]
      employees_public_view: [id, name, department, role, join_date]
    allowed_namespaces: [hr_docs, tech_docs, legal_docs]
    sensitive_patterns: [bonus, canary]

  HR_Employee:
    departments: [HR]
    allowed_tables:
      - employees_public_view     # NO salary / email / phone / address
    allowed_columns:
      employees_public_view: [id, name, department, role, join_date]
    allowed_namespaces: [hr_docs]
    sensitive_patterns: [salary, contact, bonus, canary]
    self_scope: [salary, email, phone]   # Wave 2.4: visible ONLY on the caller's own row

  Tech_Lead:
    departments: [Tech]
    allowed_tables:
      - employees_tech_view
    allowed_columns:
      employees_tech_view: [id, name, department, role]
    allowed_namespaces: [tech_docs, it_docs]
    sensitive_patterns: [salary, contact, bonus, canary]
    self_scope: [salary, email, phone]   # Wave 2.4

  Tech_Engineer:
    departments: [Tech]
    allowed_tables:
      - employees_tech_view
    allowed_columns:
      employees_tech_view: [id, name, department, role]
    allowed_namespaces: [tech_docs, it_docs]
    sensitive_patterns: [salary, contact, bonus, canary]
    self_scope: [salary, email, phone]   # Wave 2.4

  Business_Analyst:
    departments: [Business]
    allowed_tables:
      - employees_public_view
    allowed_columns:
      employees_public_view: [id, name, department, role, join_date]
    allowed_namespaces: [business_docs, tech_docs, ops_docs]
    sensitive_patterns: [salary, contact, bonus, canary]
    self_scope: [salary, email, phone]   # Wave 2.4

  Finance_Manager:
    departments: [Finance]
    allowed_tables:
      - employees                 # payroll scope: salary visible, no contact
      - employees_public_view
    allowed_columns:
      employees: [id, name, department, role, salary]
      employees_public_view: [id, name, department, role, join_date]
    allowed_namespaces: [finance_docs, business_docs, legal_docs, ops_docs]
    sensitive_patterns: [contact, bonus, canary]

  Tech_Employee:                # legacy red-team identity (alice)
    departments: [Tech]
    allowed_tables:
      - employees_tech_view      # a DB view WITHOUT salary / email / phone columns
    allowed_columns:
      employees_tech_view: [id, name, department, role]
    allowed_namespaces: [tech_docs, it_docs]
    # Layer 6 role-aware DLP: outputs containing these are blocked for this role
    sensitive_patterns: [salary, contact, bonus, canary]
    self_scope: [salary, email, phone]   # Wave 2.4: 'my salary' works, others' does not

  default:                      # unknown role -> see nothing, search nothing
    departments: []
    allowed_tables: []
    allowed_columns: {}
    allowed_namespaces: []
    sensitive_patterns: [salary, contact, bonus, canary]

# Table catalog: which SQLite file owns each table, and which column classes
# are sensitive. The query builder only ever emits identifiers from this file.
table_catalog:
  employees:
    db: company
    sensitive_columns: {salary: salary, email: contact, phone: contact}
  employees_tech_view:
    db: company
    sensitive_columns: {}
  employees_public_view:
    db: company
    sensitive_columns: {}
  executives:
    db: executives
    sensitive_columns: {bonus: bonus}
  companies:
    db: company
    sensitive_columns: {}
  locations:
    db: company
    sensitive_columns: {}
  teams:
    db: company
    sensitive_columns: {}
  org_hierarchy:
    db: company
    sensitive_columns: {}
# NOTE: employee_pii (PAN / Aadhaar / bank details) is deliberately ABSENT
# from this catalog - the governed query layer is structurally blind to it
# (defence in depth + DPDP data minimisation; see src/db/enterprise_ext.py).
